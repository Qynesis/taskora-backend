services:

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    container_name: service-api
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: "true"
      DB_LOG_QUERIES: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend

  worker:
    container_name: service-worker
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    external: true